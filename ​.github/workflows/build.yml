name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Unzip Tool
      run: sudo apt-get install -y unzip

    - name: Extract Project
      run: |
        unzip -q R27CONNECT.zip -d extracted_app

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Build APK
      run: |
        cd extracted_app
        if [ -d "R27CONNECT" ]; then
          cd R27CONNECT
        elif [ -d "R27CONNECT-main" ]; then
          cd R27CONNECT-main
        fi
        
        flutter pub get
        flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          extracted_app/build/app/outputs/flutter-apk/app-release.apk
          extracted_app/**/build/app/outputs/flutter-apk/app-release.apk
          
